[project]
name = "npci-upi-statistics-scraper"
version = "1.0.0"
description = "Scrape, clean and validate NPCI's monthly UPI product statistics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manikala Hemanth" }]
dependencies = ["requests>=2.31", "pandas>=2.1", "pandera>=0.20"]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
npci-upi = "npci_upi_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
